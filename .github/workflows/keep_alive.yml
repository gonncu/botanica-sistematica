name: Mantener Supabase Activo

on:
  schedule:
    # Se ejecuta automáticamente cada 4 días a las 00:00 UTC
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Esto te permite ejecutarlo manualmente cuando quieras probarlo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar peticion de prueba a Supabase
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
